<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>学海灯塔 · 家长移动工作台</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome 图标库 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;600;700&display=swap');
    
    body {
      font-family: 'Noto Sans SC', system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
      padding-bottom: env(safe-area-inset-bottom);
    }

    /* 滚动条隐藏与手势优化 */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    /* 触控反馈动画 */
    .touch-btn:active {
      transform: scale(0.96);
    }

    /* 打印专用样式 */
    @media print {
      body * {
        visibility: hidden;
      }
      #mobilePrintArea, #mobilePrintArea * {
        visibility: visible;
      }
      #mobilePrintArea {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
        margin: 0;
        padding: 0;
        background: #fff !important;
      }
      .no-print {
        display: none !important;
      }
      .print-page-break {
        page-break-before: always;
        break-before: page;
      }
      .print-avoid-break {
        page-break-inside: avoid;
        break-inside: avoid;
      }
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 antialiased min-h-screen flex flex-col justify-between select-none">

  <!-- 顶部轻量状态栏 -->
  <header class="no-print sticky top-0 z-40 bg-white/95 backdrop-blur-md border-b border-slate-200/80 px-4 py-2.5 flex items-center justify-between shadow-xs">
    <div class="flex items-center space-x-2.5">
      <div class="w-8 h-8 rounded-xl bg-indigo-600 flex items-center justify-center text-white shadow-sm shadow-indigo-200">
        <i class="fa-solid fa-mobile-screen-button text-sm"></i>
      </div>
      <div>
        <h1 class="text-sm font-bold text-slate-900 leading-tight">家长移动工作台</h1>
        <p class="text-[10px] text-slate-400 flex items-center gap-1">
          <span id="cloudStatusDot" class="w-1.5 h-1.5 rounded-full bg-emerald-500"></span>
          <span id="cloudStatusText">已连接腾讯云数据库</span>
        </p>
      </div>
    </div>
    <div class="flex items-center space-x-2">
      <!-- 模式切换与数据重置抽屉按钮 -->
      <button onclick="toggleConfigModal()" class="px-2.5 py-1 text-xs bg-slate-100 hover:bg-slate-200 active:bg-slate-300 rounded-lg text-slate-600 font-medium transition-colors flex items-center gap-1">
        <i class="fa-solid fa-cloud-arrow-up text-indigo-500"></i>
        <span>云端设置</span>
      </button>
    </div>
  </header>

  <!-- 主内容容器（限定手机单手手持最佳宽度） -->
  <main class="no-print flex-1 w-full max-w-lg mx-auto pb-24 overflow-x-hidden">

    <!-- ============================================================== -->
    <!-- Tab 1: 【极速拍题】（默认首页）                                    -->
    <!-- ============================================================== -->
    <section id="tab-capture" class="p-4 space-y-4">
      
      <!-- 极速录题卡片 -->
      <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-200/90 space-y-4">
        
        <!-- 题干拍照区（必填，突出大触控） -->
        <div>
          <div class="flex items-center justify-between mb-1.5">
            <span class="text-xs font-bold text-slate-800 flex items-center">
              <i class="fa-solid fa-camera text-indigo-600 mr-1.5 text-sm"></i> 题干照片拍摄 <span class="text-rose-500 ml-1">*必填</span>
            </span>
            <span class="text-[10px] text-slate-400">优先唤起后置微距</span>
          </div>

          <!-- 隐藏文件域，使用 capture="environment" 强制调起手机后置摄像头 -->
          <input type="file" id="cameraQuestionInput" accept="image/*" capture="environment" class="hidden" onchange="handleImageCaptured(event, 'question')">
          
          <div id="questionPhotoBox" onclick="document.getElementById('cameraQuestionInput').click()" class="touch-btn border-2 border-dashed border-indigo-200 bg-indigo-50/40 rounded-xl p-4 text-center cursor-pointer transition-all flex flex-col items-center justify-center min-h-[140px]">
            <div id="questionPhotoEmpty" class="space-y-1">
              <div class="w-12 h-12 mx-auto rounded-full bg-indigo-600 text-white flex items-center justify-center text-lg shadow-md shadow-indigo-200">
                <i class="fa-solid fa-camera"></i>
              </div>
              <p class="text-xs font-bold text-indigo-900 mt-2">点击调起相机拍题干</p>
            </div>
            
            <div id="questionPhotoPreview" class="hidden relative w-full">
              <img id="questionImgElement" src="" alt="题干缩略图" class="w-full max-h-56 object-contain rounded-lg border border-slate-200 bg-white">
              <button type="button" onclick="clearCapturedImage(event, 'question')" class="absolute top-2 right-2 bg-rose-500/90 text-white w-7 h-7 rounded-full flex items-center justify-center shadow-lg active:scale-90">
                <i class="fa-solid fa-xmark text-xs"></i>
              </button>
            </div>
          </div>
        </div>

        <!-- 解析/批改图拍照区（方案 A 物理隔离，选填） -->
        <div class="pt-2 border-t border-slate-100">
          <div class="flex items-center justify-between mb-1.5">
            <span class="text-xs font-bold text-slate-800 flex items-center">
              <i class="fa-solid fa-file-shield text-emerald-600 mr-1.5 text-sm"></i> 答案/老师批改图 <span class="text-slate-400 text-[10px] font-normal ml-1">（选填·防剧透）</span>
            </span>
            <span class="text-[10px] text-emerald-600 bg-emerald-50 px-1.5 py-0.5 rounded">PC端翻转背面才可见</span>
          </div>

          <input type="file" id="cameraAnalysisInput" accept="image/*" capture="environment" class="hidden" onchange="handleImageCaptured(event, 'analysis')">
          
          <div id="analysisPhotoBox" onclick="document.getElementById('cameraAnalysisInput').click()" class="touch-btn border border-dashed border-slate-300 bg-slate-50/60 rounded-xl p-3 text-center cursor-pointer transition-all flex items-center justify-center min-h-[70px]">
            <div id="analysisPhotoEmpty" class="flex items-center space-x-2 text-slate-500">
              <i class="fa-solid fa-camera-rotate text-emerald-500 text-base"></i>
              <span class="text-xs font-medium">拍试卷背面答案或红笔批改（选填）</span>
            </div>
            
            <div id="analysisPhotoPreview" class="hidden relative w-full">
              <img id="analysisImgElement" src="" alt="解析缩略图" class="w-full max-h-40 object-contain rounded-lg border border-slate-200 bg-white">
              <button type="button" onclick="clearCapturedImage(event, 'analysis')" class="absolute top-2 right-2 bg-rose-500/90 text-white w-7 h-7 rounded-full flex items-center justify-center shadow-lg active:scale-90">
                <i class="fa-solid fa-xmark text-xs"></i>
              </button>
            </div>
          </div>
        </div>

        <!-- 学科大胶囊选择区（单手横滑点选） -->
        <div>
          <label class="block text-xs font-bold text-slate-700 mb-2">选择学科 <span class="text-rose-500">*</span></label>
          <div id="subjectChipsContainer" class="flex items-center space-x-2 overflow-x-auto no-scrollbar py-1">
            <!-- 动态生成胶囊 -->
          </div>
          <input type="hidden" id="currentSubject" value="数学">
        </div>

        <!-- 来源快捷芯片与手填 -->
        <div>
          <div class="flex items-center justify-between mb-1.5">
            <label class="text-xs font-bold text-slate-700">错题来源</label>
            <div class="flex items-center space-x-1 text-[11px] text-slate-400">
              <span>快捷点选：</span>
            </div>
          </div>
          <div class="flex flex-wrap gap-1.5 mb-2">
            <span onclick="setSourceChip('平时作业')" class="source-chip touch-btn px-2.5 py-1 text-[11px] font-medium rounded-lg bg-slate-100 text-slate-600 border border-slate-200">平时作业</span>
            <span onclick="setSourceChip('单元测验')" class="source-chip touch-btn px-2.5 py-1 text-[11px] font-medium rounded-lg bg-slate-100 text-slate-600 border border-slate-200">单元测验</span>
            <span onclick="setSourceChip('期中模拟卷')" class="source-chip touch-btn px-2.5 py-1 text-[11px] font-medium rounded-lg bg-slate-100 text-slate-600 border border-slate-200">期中模拟卷</span>
            <span onclick="setSourceChip('压轴突破题')" class="source-chip touch-btn px-2.5 py-1 text-[11px] font-medium rounded-lg bg-slate-100 text-slate-600 border border-slate-200">压轴突破题</span>
          </div>
          <input type="text" id="mobileSourceInput" placeholder="输入具体题号（如：期中模拟卷第18题）" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs focus:ring-2 focus:ring-indigo-500 focus:bg-white focus:outline-none">
        </div>

        <!-- 难度星级 -->
        <div class="flex items-center justify-between py-1">
          <span class="text-xs font-bold text-slate-700">难度星级</span>
          <div class="flex items-center space-x-2 text-amber-400 text-lg cursor-pointer" id="mobileStarBox">
            <i class="fa-solid fa-star touch-btn" onclick="setMobileStars(1)"></i>
            <i class="fa-solid fa-star touch-btn" onclick="setMobileStars(2)"></i>
            <i class="fa-solid fa-star touch-btn" onclick="setMobileStars(3)"></i>
            <i class="fa-regular fa-star touch-btn" onclick="setMobileStars(4)"></i>
            <i class="fa-regular fa-star touch-btn" onclick="setMobileStars(5)"></i>
          </div>
          <input type="hidden" id="mobileDifficulty" value="3">
        </div>

        <!-- 错因标签大芯片多选 -->
        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1.5">错因诊断（大触控多选）</label>
          <div class="grid grid-cols-3 gap-2" id="mobileReasonContainer">
            <button type="button" onclick="toggleReasonBtn(this, '概念不清')" class="reason-btn touch-btn py-2 px-1 text-xs font-medium rounded-xl border border-slate-200 text-slate-600 bg-slate-50 flex items-center justify-center">
              概念不清
            </button>
            <button type="button" onclick="toggleReasonBtn(this, '审题粗心')" class="reason-btn touch-btn py-2 px-1 text-xs font-medium rounded-xl border border-slate-200 text-slate-600 bg-slate-50 flex items-center justify-center">
              审题粗心
            </button>
            <button type="button" onclick="toggleReasonBtn(this, '计算失误')" class="reason-btn touch-btn py-2 px-1 text-xs font-medium rounded-xl border border-slate-200 text-slate-600 bg-slate-50 flex items-center justify-center">
              计算失误
            </button>
            <button type="button" onclick="toggleReasonBtn(this, '思路堵塞')" class="reason-btn touch-btn py-2 px-1 text-xs font-medium rounded-xl border border-slate-200 text-slate-600 bg-slate-50 flex items-center justify-center">
              思路堵塞
            </button>
            <button type="button" onclick="toggleReasonBtn(this, '公式混淆')" class="reason-btn touch-btn py-2 px-1 text-xs font-medium rounded-xl border border-slate-200 text-slate-600 bg-slate-50 flex items-center justify-center">
              公式混淆
            </button>
            <button type="button" onclick="toggleReasonBtn(this, '新颖题型')" class="reason-btn touch-btn py-2 px-1 text-xs font-medium rounded-xl border border-slate-200 text-slate-600 bg-slate-50 flex items-center justify-center">
              新颖题型
            </button>
          </div>
        </div>

        <!-- 选填：折叠高级文字描述（默认收起不占地） -->
        <details class="group border border-slate-200 rounded-xl overflow-hidden text-xs">
          <summary class="p-2.5 bg-slate-50 text-slate-600 font-semibold cursor-pointer list-none flex items-center justify-between">
            <span class="flex items-center"><i class="fa-solid fa-pen-to-square mr-1.5 text-slate-400"></i> 文字补充（选填）</span>
            <i class="fa-solid fa-chevron-down text-slate-400 group-open:rotate-180 transition-transform"></i>
          </summary>
          <div class="p-3 bg-white space-y-2.5 border-t border-slate-100">
            <div>
              <label class="block text-[11px] text-slate-500 mb-1">题干文字摘抄（方便电脑搜索）</label>
              <textarea id="mobileQuestionText" rows="2" placeholder="纯拍图已足够，亦可补充部分文字..." class="w-full p-2 bg-slate-50 border border-slate-200 rounded-lg text-xs focus:outline-none"></textarea>
            </div>
            <div>
              <label class="block text-[11px] text-slate-500 mb-1">当时错因反思 / 家长叮嘱</label>
              <textarea id="mobileReflectionText" rows="2" placeholder="写给孩子的提醒备注..." class="w-full p-2 bg-slate-50 border border-slate-200 rounded-lg text-xs focus:outline-none"></textarea>
            </div>
            <div>
              <label class="block text-[11px] text-slate-500 mb-1">文字版标准答案步骤</label>
              <textarea id="mobileAnalysisText" rows="2" placeholder="若拍了解析图可不写..." class="w-full p-2 bg-slate-50 border border-slate-200 rounded-lg text-xs focus:outline-none"></textarea>
            </div>
          </div>
        </details>

        <!-- 提交并同步至云端错题库 -->
        <button type="button" id="submitBtn" onclick="handleMobileSubmit()" class="touch-btn w-full py-3.5 bg-indigo-600 hover:bg-indigo-700 active:bg-indigo-800 text-white rounded-xl text-sm font-bold shadow-md shadow-indigo-200 flex items-center justify-center space-x-2 transition-all">
          <i class="fa-solid fa-cloud-arrow-up text-base"></i>
          <span>保存并同步到错题库</span>
        </button>

      </div>
    </section>

    <!-- ============================================================== -->
    <!-- Tab 2: 【学情简报】（三态柱形进度大盘 + 紧凑清单）                   -->
    <!-- ============================================================== -->
    <section id="tab-report" class="hidden p-4 space-y-4">
      
      <!-- 攻克进度大盘卡片 -->
      <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-200 space-y-3">
        <div class="flex items-center justify-between">
          <h2 class="text-xs font-bold text-slate-800 flex items-center">
            <i class="fa-solid fa-chart-pie text-indigo-600 mr-1.5"></i> 错题攻克大盘
          </h2>
          <span id="reportTotalBadge" class="text-[11px] font-bold px-2 py-0.5 rounded-full bg-slate-100 text-slate-700">总计 0 题</span>
        </div>

        <!-- 三态比例进度条 -->
        <div class="space-y-1.5">
          <div class="w-full h-3 rounded-full bg-slate-100 flex overflow-hidden">
            <div id="bar-mastered" class="bg-emerald-500 transition-all duration-500" style="width: 0%"></div>
            <div id="bar-progress" class="bg-amber-400 transition-all duration-500" style="width: 0%"></div>
            <div id="bar-pending" class="bg-rose-500 transition-all duration-500" style="width: 0%"></div>
          </div>
          <div class="flex justify-between text-[11px] font-medium pt-1">
            <span class="text-emerald-600 flex items-center"><i class="fa-solid fa-circle text-[7px] mr-1"></i> 已掌握: <b id="statMasteredCount" class="ml-1">0</b></span>
            <span class="text-amber-500 flex items-center"><i class="fa-solid fa-circle text-[7px] mr-1"></i> 攻克中: <b id="statProgressCount" class="ml-1">0</b></span>
            <span class="text-rose-500 flex items-center"><i class="fa-solid fa-circle text-[7px] mr-1"></i> 待攻克: <b id="statPendingCount" class="ml-1">0</b></span>
          </div>
        </div>

        <!-- 快捷状态过滤胶囊 -->
        <div class="grid grid-cols-4 gap-1.5 pt-2 border-t border-slate-100 text-xs">
          <button onclick="setReportFilter('ALL')" id="filterBtn-ALL" class="report-filter-btn py-1.5 rounded-lg font-bold bg-slate-900 text-white">全部</button>
          <button onclick="setReportFilter('PENDING')" id="filterBtn-PENDING" class="report-filter-btn py-1.5 rounded-lg text-slate-600 bg-slate-100">待攻克</button>
          <button onclick="setReportFilter('PROGRESS')" id="filterBtn-PROGRESS" class="report-filter-btn py-1.5 rounded-lg text-slate-600 bg-slate-100">攻克中</button>
          <button onclick="setReportFilter('MASTERED')" id="filterBtn-MASTERED" class="report-filter-btn py-1.5 rounded-lg text-slate-600 bg-slate-100">已掌握</button>
        </div>
      </div>

      <!-- 快速多选入篮浮动条（简报页快捷组卷） -->
      <div class="flex items-center justify-between px-1 text-xs text-slate-500">
        <span>点击题目左侧圆圈，加入重练试卷</span>
        <button onclick="selectAllVisibleToBasket()" class="text-indigo-600 font-bold active:underline">全选当前</button>
      </div>

      <!-- 紧凑错题管理清单 -->
      <div id="compactMistakesFeed" class="space-y-3">
        <!-- 动态渲染错题流 -->
      </div>

      <!-- 空状态提示 -->
      <div id="reportEmptyState" class="hidden py-12 text-center">
        <div class="w-12 h-12 mx-auto rounded-full bg-slate-100 flex items-center justify-center text-slate-300 text-xl mb-2">
          <i class="fa-solid fa-folder-open"></i>
        </div>
        <p class="text-xs text-slate-400">该分类下暂无错题，快去拍一道吧！</p>
      </div>

    </section>

    <!-- ============================================================== -->
    <!-- Tab 3: 【重练组卷】（试卷篮与移动无线打印）                         -->
    <!-- ============================================================== -->
    <section id="tab-paper" class="hidden p-4 space-y-4">
      
      <!-- 组卷控制台 -->
      <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-200 space-y-3">
        <div class="flex items-center justify-between">
          <div>
            <h2 class="text-xs font-bold text-slate-900 flex items-center">
              <i class="fa-solid fa-print text-indigo-600 mr-1.5"></i> 移动端组卷打印
            </h2>
            <p class="text-[10px] text-slate-400 mt-0.5">支持 AirPrint 无线打印及转为 PDF 微信发送</p>
          </div>
          <span id="paperCountBadge" class="text-xs font-bold px-2 py-0.5 bg-rose-50 text-rose-600 border border-rose-200 rounded-full">已选 0 题</span>
        </div>

        <div class="flex items-center space-x-2 pt-1">
          <button onclick="clearBasketMobile()" class="touch-btn flex-1 py-2 text-xs text-rose-600 bg-rose-50 border border-rose-200 rounded-xl font-medium">
            <i class="fa-solid fa-trash-can mr-1"></i> 清空试卷篮
          </button>
          <button onclick="triggerMobilePrint()" class="touch-btn flex-2 py-2 px-4 bg-indigo-600 text-white rounded-xl text-xs font-bold shadow-md shadow-indigo-100 flex items-center justify-center space-x-1">
            <i class="fa-solid fa-file-pdf"></i>
            <span>无线打印 / 存为 PDF</span>
          </button>
        </div>
      </div>

      <!-- 试卷标题配置 -->
      <div class="bg-white rounded-xl p-3 border border-slate-200 space-y-2 text-xs">
        <div>
          <label class="block text-[10px] text-slate-400 mb-1">试卷标题</label>
          <input type="text" id="paperTitleMobile" value="错题查漏补缺 · 自我突破重练卷" oninput="renderMobilePaper()" class="w-full p-2 bg-slate-50 border border-slate-200 rounded-lg text-xs">
        </div>
        <div class="flex items-center justify-between">
          <span class="text-slate-600">在文末附带【家长批改答案】</span>
          <input type="checkbox" id="paperIncludeAnswers" checked onchange="renderMobilePaper()" class="w-4 h-4 text-indigo-600 rounded">
        </div>
      </div>

      <!-- 移动端试卷模拟排版（直观预览） -->
      <div id="mobilePaperContainer" class="bg-white rounded-2xl p-4 border border-slate-200 shadow-sm space-y-6">
        <!-- 动态生成试卷内容 -->
      </div>

    </section>

  </main>

  <!-- 底部固定单手导航栏（Bottom Tab Bar） -->
  <nav class="no-print fixed bottom-0 left-0 right-0 z-40 bg-white/95 backdrop-blur-md border-t border-slate-200 px-6 py-2 shadow-lg max-w-lg mx-auto">
    <div class="flex items-center justify-around">
      
      <!-- Tab 1: 极速拍题 -->
      <button onclick="switchMobileTab('capture')" id="tabBtn-capture" class="touch-btn flex flex-col items-center text-indigo-600 relative">
        <div class="w-10 h-7 flex items-center justify-center text-lg">
          <i class="fa-solid fa-camera"></i>
        </div>
        <span class="text-[10px] font-bold mt-0.5">极速拍题</span>
      </button>

      <!-- Tab 2: 学情简报 -->
      <button onclick="switchMobileTab('report')" id="tabBtn-report" class="touch-btn flex flex-col items-center text-slate-400 relative">
        <div class="w-10 h-7 flex items-center justify-center text-lg">
          <i class="fa-solid fa-chart-column"></i>
        </div>
        <span class="text-[10px] font-medium mt-0.5">学情简报</span>
      </button>

      <!-- Tab 3: 重练组卷 -->
      <button onclick="switchMobileTab('paper')" id="tabBtn-paper" class="touch-btn flex flex-col items-center text-slate-400 relative">
        <div class="w-10 h-7 flex items-center justify-center text-lg">
          <i class="fa-solid fa-file-pen"></i>
        </div>
        <span class="text-[10px] font-medium mt-0.5">重练组卷</span>
        <!-- 购物车角标 -->
        <span id="navBasketBadge" class="hidden absolute top-0 right-1 w-4 h-4 rounded-full bg-rose-500 text-white text-[9px] font-extrabold flex items-center justify-center">0</span>
      </button>

    </div>
  </nav>

  <!-- 云端与模式配置弹窗 -->

        <div>
          <label class="block font-semibold text-slate-700 mb-1">运行引擎模式</label>
          <div class="grid grid-cols-2 gap-2">
            <button type="button" onclick="setEngineMode('cloudbase')" id="modeBtn-cloudbase" class="p-2.5 rounded-xl border-2 font-bold text-center border-indigo-600 bg-indigo-50/50 text-indigo-700">
              腾讯云 PostgreSQL
            </button>
            <button type="button" onclick="setEngineMode('local')" id="modeBtn-local" class="p-2.5 rounded-xl border border-slate-200 font-medium text-center text-slate-600 bg-slate-50">
              本地离线模拟
            </button>

        </div>

        <div>
          <label class="block font-semibold text-slate-700 mb-1">CloudBase REST 网关</label>
          <input type="text" id="cfgGatewayUrl" value="https://panshao-cloud-d1go0fikpe924c792.api.tcloudbasegateway.com/v1/rdb/rest/mistakes" class="w-full p-2 bg-slate-50 border border-slate-200 rounded-lg text-[11px] font-mono">
        </div>

        <div>
          <label class="block font-semibold text-slate-700 mb-1">Publishable Key (匿名写权限)</label>
          <input type="text" id="cfgPublishKey" placeholder="默认匿名访问，若有自建网关可填 Key" class="w-full p-2 bg-slate-50 border border-slate-200 rounded-lg text-[11px] font-mono">

  <!-- 专门供浏览器原生调用的纯净打印层 -->
  <div id="mobilePrintArea" class="hidden">
    <!-- 内容将在点击打印时与 mobilePaperContainer 实时同步 -->
  </div>

  <!-- 手机端轻量 Toast 提示 -->
  <div id="mobileToast" class="hidden fixed top-4 left-1/2 -translate-x-1/2 z-50 bg-slate-900/95 text-white px-4 py-2.5 rounded-full shadow-2xl flex items-center space-x-2 text-xs transition-all duration-200">
    <i id="toastIcon" class="fa-solid fa-circle-check text-emerald-400"></i>
    <span id="toastMsg">操作成功</span>
  </div>

  <script>
    // ==============================================================
    // 1. 全局配置与状态初始化
    // ==============================================================
    const SUBJECTS = ['数学', '物理', '化学', '英语', '语文', '生物', '历史', '地理', '道法/政治', '其他'];
    
    let currentEngineMode = localStorage.getItem('lighthouse_engine_mode') || 'cloudbase';
    let cloudGatewayUrl = localStorage.getItem('lighthouse_gateway_url') || 'https://panshao-cloud-d1go0fikpe924c792.api.tcloudbasegateway.com/v1/rdb/rest/mistakes';
    let cloudPublishKey = localStorage.getItem('lighthouse_publish_key') || '';

    let mistakeRecords = [];
    let selectedReasons = new Set();
    let currentQuestionImgBase64 = '';
    let currentAnalysisImgBase64 = '';
    let mobileBasketIds = new Set();
    let reportCurrentFilter = 'ALL';

    // 默认学科胶囊生成
    function initSubjectChips() {
      const container = document.getElementById('subjectChipsContainer');
      container.innerHTML = SUBJECTS.map((sub, idx) => {
        const isDefault = sub === '数学';
        return `
          <button type="button" onclick="selectSubjectChip('${sub}')" class="subject-chip touch-btn shrink-0 px-3.5 py-1.5 rounded-full text-xs font-bold transition-all ${isDefault ? 'bg-indigo-600 text-white shadow-sm shadow-indigo-200' : 'bg-slate-100 text-slate-600 border border-slate-200'}" data-subject="${sub}">
            ${sub}
          </button>
        `;
      }).join('');
    }

    function selectSubjectChip(sub) {
      document.getElementById('currentSubject').value = sub;
      document.querySelectorAll('.subject-chip').forEach(btn => {
        if (btn.getAttribute('data-subject') === sub) {
          btn.className = 'subject-chip touch-btn shrink-0 px-3.5 py-1.5 rounded-full text-xs font-bold transition-all bg-indigo-600 text-white shadow-sm shadow-indigo-200';
        } else {
          btn.className = 'subject-chip touch-btn shrink-0 px-3.5 py-1.5 rounded-full text-xs font-bold transition-all bg-slate-100 text-slate-600 border border-slate-200';
        }
      });
    }

    function setSourceChip(text) {
      document.getElementById('mobileSourceInput').value = text;
    }

    function setMobileStars(count) {
      document.getElementById('mobileDifficulty').value = count;
      const box = document.getElementById('mobileStarBox');
      box.innerHTML = '';
      for (let i = 1; i <= 5; i++) {
        box.innerHTML += i <= count
          ? `<i class="fa-solid fa-star touch-btn" onclick="setMobileStars(${i})"></i>`
          : `<i class="fa-regular fa-star touch-btn" onclick="setMobileStars(${i})"></i>`;
      }
    }

    function toggleReasonBtn(el, reason) {
      if (selectedReasons.has(reason)) {
        selectedReasons.delete(reason);
        el.className = 'reason-btn touch-btn py-2 px-1 text-xs font-medium rounded-xl border border-slate-200 text-slate-600 bg-slate-50 flex items-center justify-center';
      } else {
        selectedReasons.add(reason);
        el.className = 'reason-btn touch-btn py-2 px-1 text-xs font-bold rounded-xl border border-indigo-600 text-white bg-indigo-600 shadow-sm flex items-center justify-center';
      }
    }

    // ==============================================================
    // 2. 前端 Canvas 高清等比下采样压缩管道
    // ==============================================================
    function compressImageMobile(file, maxWidth = 1000, quality = 0.75) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = (e) => {
          const img = new Image();
          img.src = e.target.result;
          img.onload = () => {
            const canvas = document.createElement('canvas');
            let width = img.width;
            let height = img.height;

            if (width > maxWidth) {
              height = Math.round((height * maxWidth) / width);
              width = maxWidth;
            }

            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);

            const compressedBase64 = canvas.toDataURL('image/jpeg', quality);
            resolve(compressedBase64);
          };
          img.onerror = reject;
        };
        reader.onerror = reject;
      });
    }

    async function handleImageCaptured(event, type) {
      const file = event.target.files[0];
      if (!file) return;

      showToast('正在处理拍摄图像...', 'info');

      try {
        const compressedBase64 = await compressImageMobile(file, 1000, 0.75);
        if (type === 'question') {
          currentQuestionImgBase64 = compressedBase64;
          document.getElementById('questionImgElement').src = compressedBase64;
          document.getElementById('questionPhotoEmpty').classList.add('hidden');
          document.getElementById('questionPhotoPreview').classList.remove('hidden');
          showToast('题干照片拍摄成功！');
        } else {
          currentAnalysisImgBase64 = compressedBase64;
          document.getElementById('analysisImgElement').src = compressedBase64;
          document.getElementById('analysisPhotoEmpty').classList.add('hidden');
          document.getElementById('analysisPhotoPreview').classList.remove('hidden');
          showToast('解析批改图已安全隔离就绪！');
        }
      } catch (err) {
        console.error(err);
        showToast('图片处理失败，请重拍', 'error');
      }
    }

    function clearCapturedImage(e, type) {
      if (e) e.stopPropagation();
      if (type === 'question') {
        currentQuestionImgBase64 = '';
        document.getElementById('cameraQuestionInput').value = '';
        document.getElementById('questionImgElement').src = '';
        document.getElementById('questionPhotoEmpty').classList.remove('hidden');
        document.getElementById('questionPhotoPreview').classList.add('hidden');
      } else {
        currentAnalysisImgBase64 = '';
        document.getElementById('cameraAnalysisInput').value = '';
        document.getElementById('analysisImgElement').src = '';
        document.getElementById('analysisPhotoEmpty').classList.remove('hidden');
        document.getElementById('analysisPhotoPreview').classList.add('hidden');
      }
    }

    // ==============================================================
    // 3. 腾讯云 CloudBase REST API 读写层（兼容方案 A 实体）
    // ==============================================================
    async function fetchMistakesFromCloud() {
      if (currentEngineMode === 'local') {
        const cached = localStorage.getItem('lighthouse_mobile_local_data');
        return cached ? JSON.parse(cached) : getInitialMockData();
      }

      try {
        const headers = { 'Content-Type': 'application/json' };
        if (cloudPublishKey) {
          headers['Authorization'] = `Bearer ${cloudPublishKey}`;
        }
        const resp = await fetch(`${cloudGatewayUrl}?select=*&order=created_at.desc`, { credentials: 'omit', headers });
        if (!resp.ok) throw new Error(`云端响应错误: ${resp.status}`);
        const rows = await resp.json();
        
        // 映射为前端模型 (snake_case -> camelCase)
        return rows.map(r => ({
          id: r.id,
          subject: r.subject,
          source: r.source || '',
          difficulty: Number(r.difficulty || 3),
          reasons: Array.isArray(r.reasons) ? r.reasons : [],
          questionText: r.question_text || '',
          reflection: r.reflection || '',
          analysis: r.analysis || '',
          status: r.status || 'PENDING',
          createdAt: Number(r.created_at || Date.now()),
          reviewCount: Number(r.review_count || 0),
          imageData: r.image_data || '',
          analysisImageData: r.analysis_image_data || '',
          creatorRole: r.creator_role || 'PARENT'
        }));
      } catch (err) {
        console.warn('云端连接异常，降级至本地缓存', err);
        document.getElementById('cloudStatusDot').className = 'w-1.5 h-1.5 rounded-full bg-amber-500';
        document.getElementById('cloudStatusText').innerText = '离线/本地存储模式';
        const cached = localStorage.getItem('lighthouse_mobile_local_data');
        return cached ? JSON.parse(cached) : getInitialMockData();
      }
    }

    async function saveMistakeToCloud(item) {
      if (currentEngineMode === 'local') {
        const idx = mistakeRecords.findIndex(m => m.id === item.id);
        if (idx >= 0) mistakeRecords[idx] = item;
        else mistakeRecords.unshift(item);
        localStorage.setItem('lighthouse_mobile_local_data', JSON.stringify(mistakeRecords));
        return true;
      }

      const row = {
        id: item.id,
        subject: item.subject,
        source: item.source,
        difficulty: item.difficulty,
        reasons: item.reasons,
        question_text: item.questionText,
        reflection: item.reflection,
        analysis: item.analysis,
        status: item.status,
        created_at: item.createdAt,
        review_count: item.reviewCount,
        image_data: item.imageData || null,
        analysis_image_data: item.analysisImageData || null,
        creator_role: item.creatorRole || 'PARENT'
      };

      try {
        const headers = {
          'Content-Type': 'application/json',
          'Prefer': 'resolution=merge-duplicates'
        };
        if (cloudPublishKey) {
          headers['Authorization'] = `Bearer ${cloudPublishKey}`;
        }
        const resp = await fetch(cloudGatewayUrl, {
          method: 'POST',
          credentials: 'omit',
          headers,
          body: JSON.stringify(row)
        });
        if (!resp.ok) throw new Error('写入失败');
        return true;
      } catch (err) {
        console.error('云端保存失败，写入本地备份', err);
        const idx = mistakeRecords.findIndex(m => m.id === item.id);
        if (idx >= 0) mistakeRecords[idx] = item;
        else mistakeRecords.unshift(item);
        localStorage.setItem('lighthouse_mobile_local_data', JSON.stringify(mistakeRecords));
        return true;
      }
    }

    async function deleteMistakeFromCloud(id) {
      if (currentEngineMode === 'local') {
        mistakeRecords = mistakeRecords.filter(m => m.id !== id);
        localStorage.setItem('lighthouse_mobile_local_data', JSON.stringify(mistakeRecords));
        return true;
      }

      try {
        const headers = {};
        if (cloudPublishKey) headers['Authorization'] = `Bearer ${cloudPublishKey}`;
        await fetch(`${cloudGatewayUrl}?id=eq.${id}`, { method: 'DELETE', credentials: 'omit', headers });
        return true;
      } catch (err) {
        console.error('删除云端记录失败', err);
        return false;
      }
    }

    // ==============================================================
    // 4. 录题提交交互流程
    // ==============================================================
    async function handleMobileSubmit() {
      const submitBtn = document.getElementById('submitBtn');
      const subject = document.getElementById('currentSubject').value;
      const source = document.getElementById('mobileSourceInput').value.trim() || '日常作业';
      const difficulty = parseInt(document.getElementById('mobileDifficulty').value, 10);
      const questionText = document.getElementById('mobileQuestionText').value.trim();
      const reflection = document.getElementById('mobileReflectionText').value.trim();
      const analysis = document.getElementById('mobileAnalysisText').value.trim();

      // 强校验：必须拍摄题干照片（或输入题干文字）
      if (!currentQuestionImgBase64 && !questionText) {
        showToast('请先拍摄题干照片或输入题目！', 'warning');
        return;
      }

      submitBtn.disabled = true;
      submitBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-1"></i> 上传同步中...';

      const newId = `mistake_${Date.now()}_${Math.random().toString(36).substr(2, 4)}`;
      const newMistake = {
        id: newId,
        subject,
        source,
        difficulty,
        reasons: Array.from(selectedReasons),
        questionText,
        reflection,
        analysis,
        status: 'PENDING',
        createdAt: Date.now(),
        reviewCount: 0,
        imageData: currentQuestionImgBase64,
        analysisImageData: currentAnalysisImgBase64, // 方案 A 独立存储
        creatorRole: 'PARENT'
      };

      await saveMistakeToCloud(newMistake);
      showToast('🎉 录题成功，已实时同步给孩子！');

      // 连拍优化：重置表单，但保留当前学科
      clearCapturedImage(null, 'question');
      clearCapturedImage(null, 'analysis');
      document.getElementById('mobileQuestionText').value = '';
      document.getElementById('mobileReflectionText').value = '';
      document.getElementById('mobileAnalysisText').value = '';
      selectedReasons.clear();
      document.querySelectorAll('.reason-btn').forEach(btn => {
        btn.className = 'reason-btn touch-btn py-2 px-1 text-xs font-medium rounded-xl border border-slate-200 text-slate-600 bg-slate-50 flex items-center justify-center';
      });
      setMobileStars(3);

      submitBtn.disabled = false;
      submitBtn.innerHTML = '<i class="fa-solid fa-cloud-arrow-up text-base"></i><span>保存并同步到错题库</span>';

      // 刷新数据流
      await reloadAllData();
    }

    // ==============================================================
    // 5. 学情简报看板与错题清单渲染
    // ==============================================================
    async function reloadAllData() {
      mistakeRecords = await fetchMistakesFromCloud();
      updateDashboardStats();
      renderCompactFeed();
      renderMobilePaper();
      updateBasketBadges();
    }

    function updateDashboardStats() {
      const total = mistakeRecords.length;
      const pending = mistakeRecords.filter(m => m.status === 'PENDING').length;
      const progress = mistakeRecords.filter(m => m.status === 'PROGRESS').length;
      const mastered = mistakeRecords.filter(m => m.status === 'MASTERED').length;

      document.getElementById('reportTotalBadge').innerText = `总计 ${total} 题`;
      document.getElementById('statPendingCount').innerText = pending;
      document.getElementById('statProgressCount').innerText = progress;
      document.getElementById('statMasteredCount').innerText = mastered;

      if (total > 0) {
        document.getElementById('bar-mastered').style.width = `${(mastered / total) * 100}%`;
        document.getElementById('bar-progress').style.width = `${(progress / total) * 100}%`;
        document.getElementById('bar-pending').style.width = `${(pending / total) * 100}%`;
      } else {
        document.getElementById('bar-mastered').style.width = '0%';
        document.getElementById('bar-progress').style.width = '0%';
        document.getElementById('bar-pending').style.width = '0%';
      }
    }

    function setReportFilter(status) {
      reportCurrentFilter = status;
      document.querySelectorAll('.report-filter-btn').forEach(btn => {
        btn.className = 'report-filter-btn py-1.5 rounded-lg text-slate-600 bg-slate-100';
      });
      document.getElementById(`filterBtn-${status}`).className = 'report-filter-btn py-1.5 rounded-lg font-bold bg-slate-900 text-white';
      renderCompactFeed();
    }

    function renderCompactFeed() {
      const container = document.getElementById('compactMistakesFeed');
      const emptyState = document.getElementById('reportEmptyState');

      const filtered = mistakeRecords.filter(m => {
        if (reportCurrentFilter !== 'ALL' && m.status !== reportCurrentFilter) return false;
        return true;
      });

      if (filtered.length === 0) {
        container.innerHTML = '';
        emptyState.classList.remove('hidden');
        return;
      }
      emptyState.classList.add('hidden');

      container.innerHTML = filtered.map(item => {
        const inBasket = mobileBasketIds.has(item.id);
        
        let statusBadge = '';
        if (item.status === 'PENDING') {
          statusBadge = '<span class="px-2 py-0.5 rounded text-[10px] font-bold bg-rose-50 text-rose-600 border border-rose-200">待攻克</span>';
        } else if (item.status === 'PROGRESS') {
          statusBadge = '<span class="px-2 py-0.5 rounded text-[10px] font-bold bg-amber-50 text-amber-600 border border-amber-200">攻克中</span>';
        } else {
          statusBadge = '<span class="px-2 py-0.5 rounded text-[10px] font-bold bg-emerald-50 text-emerald-600 border border-emerald-200">已掌握</span>';
        }

        const reasonsHtml = (item.reasons || []).map(r => 
          `<span class="px-1.5 py-0.5 bg-slate-100 text-slate-500 rounded text-[10px]">${r}</span>`
        ).join('');

        return `
          <div class="bg-white rounded-2xl p-3.5 border border-slate-200/90 shadow-xs space-y-2.5">
            <!-- 头部：加入试卷、学科、状态 -->
            <div class="flex items-center justify-between">
              <div class="flex items-center space-x-2">
                <button type="button" onclick="toggleBasketMobileItem('${item.id}')" class="touch-btn w-6 h-6 rounded-full flex items-center justify-center border transition-colors ${inBasket ? 'bg-indigo-600 border-indigo-600 text-white' : 'border-slate-300 text-transparent bg-white'}">
                  <i class="fa-solid fa-check text-xs"></i>
                </button>
                <span class="px-2 py-0.5 rounded-md bg-indigo-50 text-indigo-700 text-xs font-bold">${item.subject}</span>
                <span class="text-xs text-slate-400 truncate max-w-[120px]">${item.source || '平时'}</span>
              </div>
              <div class="flex items-center space-x-1.5">
                ${statusBadge}
              </div>
            </div>

            <!-- 中部：题干缩略展示 -->
            <div class="space-y-1.5">
              ${item.imageData ? `
                <div class="bg-slate-50 rounded-lg p-1.5 border border-slate-100 max-h-36 overflow-hidden flex items-center justify-center">
                  <img src="${item.imageData}" alt="题干" class="max-h-32 object-contain rounded">
                </div>
              ` : ''}

              ${item.questionText ? `
                <p class="text-xs font-medium text-slate-800 line-clamp-2 leading-relaxed">${item.questionText}</p>
              ` : ''}
            </div>

            <!-- 错因标签 -->
            <div class="flex flex-wrap gap-1">
              ${reasonsHtml}
            </div>

            <!-- 答案/批改图抽屉（家长点击查看） -->
            <details class="group text-xs pt-1 border-t border-slate-100">
              <summary class="text-slate-400 font-medium cursor-pointer list-none flex items-center justify-between py-1">
                <span class="text-[11px] text-indigo-600 flex items-center"><i class="fa-solid fa-file-circle-check mr-1"></i> 查看答案与批改底稿</span>
                <i class="fa-solid fa-chevron-down text-[10px] group-open:rotate-180 transition-transform"></i>
              </summary>
              <div class="mt-2 p-2.5 rounded-xl bg-slate-50 border border-slate-200/80 space-y-2">
                ${item.analysisImageData ? `
                  <div>
                    <span class="text-[10px] text-slate-400 block mb-1">【拍照批改底稿】</span>
                    <img src="${item.analysisImageData}" class="max-h-48 object-contain rounded border border-slate-200 mx-auto">
                  </div>
                ` : ''}
                ${item.analysis ? `
                  <div class="text-slate-700 leading-relaxed text-[11px] whitespace-pre-wrap">${item.analysis}</div>
                ` : ''}
                ${!item.analysisImageData && !item.analysis ? '<span class="text-slate-400 italic text-[11px]">未录入解析</span>' : ''}
              </div>
            </details>

            <!-- 底部操作：快捷状态流转 & 删除 -->
            <div class="pt-2 border-t border-slate-100 flex items-center justify-between text-[11px]">
              <div class="flex items-center space-x-1.5">
                <span class="text-slate-400">推进度:</span>
                <button onclick="changeMistakeStatusDirect('${item.id}', 'PENDING')" class="px-2 py-1 rounded bg-slate-100 text-slate-600 font-medium touch-btn">待攻克</button>
                <button onclick="changeMistakeStatusDirect('${item.id}', 'PROGRESS')" class="px-2 py-1 rounded bg-slate-100 text-slate-600 font-medium touch-btn">攻克中</button>
                <button onclick="changeMistakeStatusDirect('${item.id}', 'MASTERED')" class="px-2 py-1 rounded bg-slate-100 text-slate-600 font-medium touch-btn">掌握👏</button>
              </div>
              <button onclick="handleDeleteMobileItem('${item.id}')" class="text-slate-300 hover:text-rose-500 p-1">
                <i class="fa-solid fa-trash-can"></i>
              </button>
            </div>
          </div>
        `;
      }).join('');
    }

    async function changeMistakeStatusDirect(id, newStatus) {
      const item = mistakeRecords.find(m => m.id === id);
      if (!item) return;
      item.status = newStatus;
      item.reviewCount = (item.reviewCount || 0) + 1;
      await saveMistakeToCloud(item);
      showToast('状态已更新');
      updateDashboardStats();
      renderCompactFeed();
    }

    async function handleDeleteMobileItem(id) {
      await deleteMistakeFromCloud(id);
      mobileBasketIds.delete(id);
      showToast('已从错题库删除');
      await reloadAllData();
    }

    // ==============================================================
    // 6. 移动端重练组卷与无线打印引擎
    // ==============================================================
    function toggleBasketMobileItem(id) {
      if (mobileBasketIds.has(id)) {
        mobileBasketIds.delete(id);
      } else {
        mobileBasketIds.add(id);
      }
      updateBasketBadges();
      renderCompactFeed();
      renderMobilePaper();
    }

    function selectAllVisibleToBasket() {
      const filtered = mistakeRecords.filter(m => {
        if (reportCurrentFilter !== 'ALL' && m.status !== reportCurrentFilter) return false;
        return true;
      });
      filtered.forEach(m => mobileBasketIds.add(m.id));
      updateBasketBadges();
      renderCompactFeed();
      renderMobilePaper();
      showToast(`已勾选 ${filtered.length} 道题目`);
    }

    function clearBasketMobile() {
      mobileBasketIds.clear();
      updateBasketBadges();
      renderCompactFeed();
      renderMobilePaper();
      showToast('已清空重练试卷篮');
    }

    function updateBasketBadges() {
      const count = mobileBasketIds.size;
      const navBadge = document.getElementById('navBasketBadge');
      if (count > 0) {
        navBadge.innerText = count;
        navBadge.classList.remove('hidden');
      } else {
        navBadge.classList.add('hidden');
      }
      document.getElementById('paperCountBadge').innerText = `已选 ${count} 题`;
    }

    function renderMobilePaper() {
      const container = document.getElementById('mobilePaperContainer');
      const title = document.getElementById('paperTitleMobile').value || '错题查漏补缺 · 自我突破重练卷';
      const includeAnswers = document.getElementById('paperIncludeAnswers').checked;

      const selected = mistakeRecords.filter(m => mobileBasketIds.has(m.id));

      if (selected.length === 0) {
        container.innerHTML = `
          <div class="py-12 text-center text-slate-400">
            <i class="fa-solid fa-file-circle-plus text-3xl mb-2 text-slate-300"></i>
            <p class="text-xs">试卷篮为空，请先在【学情简报】中勾选需要复习的题目</p>
          </div>
        `;
        return;
      }

      // 生成手机端规范试卷
      let html = `
        <div class="text-center pb-4 border-b-2 border-slate-800">
          <h2 class="text-base font-extrabold tracking-wide">${title}</h2>
          <p class="text-[11px] text-slate-600 mt-1">姓名：__________ 日期：____年__月__日 得分：____</p>
        </div>

        <div class="space-y-6 pt-2">
      `;

      selected.forEach((item, idx) => {
        html += `
          <div class="print-avoid-break pb-4 border-b border-slate-200 space-y-2">
            <div class="flex items-start space-x-2">
              <span class="w-5 h-5 rounded-full bg-slate-900 text-white text-xs font-bold flex items-center justify-center shrink-0 mt-0.5">${idx + 1}</span>
              <div class="flex-1 space-y-1.5">
                <span class="text-[10px] font-semibold text-slate-500">[${item.subject}] (${item.source || '平时练习'})</span>
                ${item.questionText ? `<p class="text-xs font-medium text-slate-900 leading-relaxed">${item.questionText}</p>` : ''}
                ${item.imageData ? `<img src="${item.imageData}" class="max-h-52 object-contain rounded border border-slate-200 my-1">` : ''}
              </div>
            </div>
            <!-- 答题留白区 -->
            <div class="pt-2 border-t border-dashed border-slate-200">
              <span class="text-[9px] text-slate-400">【作答与演算步骤】：</span>
              <div class="h-20 w-full border-b border-dashed border-slate-200"></div>
            </div>
          </div>
        `;
      });

      html += `</div>`;

      // 附录答案页
      if (includeAnswers) {
        html += `
          <div class="print-page-break mt-6 pt-4 border-t-2 border-dashed border-slate-400">
            <div class="text-center mb-3">
              <span class="inline-block px-3 py-0.5 bg-slate-100 rounded text-slate-700 text-xs font-bold border border-slate-300">
                【参考答案与解题分析】（供批改核对）
              </span>
            </div>
            <div class="space-y-3 text-xs">
        `;
        selected.forEach((item, idx) => {
          html += `
            <div class="print-avoid-break p-2.5 rounded bg-slate-50 border border-slate-200 space-y-1 text-[11px]">
              <div class="font-bold text-slate-800">第 ${idx + 1} 题【${item.subject}】正解：</div>
              ${item.analysisImageData ? `<img src="${item.analysisImageData}" class="max-h-40 object-contain rounded my-1 border border-slate-200">` : ''}
              ${item.analysis ? `<div class="text-slate-700 whitespace-pre-wrap">${item.analysis}</div>` : ''}
              ${!item.analysisImageData && !item.analysis ? '<span class="text-slate-400 italic">未填文字解析</span>' : ''}
            </div>
          `;
        });
        html += `</div></div>`;
      }

      container.innerHTML = html;

      // 同步给纯净打印层
      document.getElementById('mobilePrintArea').innerHTML = container.innerHTML;
    }

    function triggerMobilePrint() {
      if (mobileBasketIds.size === 0) {
        showToast('试卷篮为空，请先勾选题目！', 'warning');
        return;
      }
      renderMobilePaper();
      showToast('正在唤起系统打印服务...');
      setTimeout(() => {
        window.print();
      }, 300);
    }

    // ==============================================================
    // 7. 选项卡切换与交互组件
    // ==============================================================
    function switchMobileTab(tabKey) {
      ['capture', 'report', 'paper'].forEach(t => {
        document.getElementById(`tab-${t}`).classList.add('hidden');
        const btn = document.getElementById(`tabBtn-${t}`);
        btn.className = 'touch-btn flex flex-col items-center text-slate-400 relative';
        btn.querySelector('span').className = 'text-[10px] font-medium mt-0.5';
      });

      document.getElementById(`tab-${tabKey}`).classList.remove('hidden');
      const activeBtn = document.getElementById(`tabBtn-${tabKey}`);
      activeBtn.className = 'touch-btn flex flex-col items-center text-indigo-600 relative';
      activeBtn.querySelector('span').className = 'text-[10px] font-bold mt-0.5';

      if (tabKey === 'report') {
        renderCompactFeed();
      } else if (tabKey === 'paper') {
        renderMobilePaper();
      }
    }

    function toggleConfigModal() {
      const modal = document.getElementById('configModal');
      modal.classList.toggle('hidden');
    }

    function setEngineMode(mode) {
      currentEngineMode = mode;
      document.querySelectorAll('#configModal button[id^="modeBtn-"]').forEach(btn => {
        btn.className = 'p-2.5 rounded-xl border border-slate-200 font-medium text-center text-slate-600 bg-slate-50';
      });
      document.getElementById(`modeBtn-${mode}`).className = 'p-2.5 rounded-xl border-2 font-bold text-center border-indigo-600 bg-indigo-50/50 text-indigo-700';
    }

    function saveCloudConfig() {
      localStorage.setItem('lighthouse_engine_mode', currentEngineMode);
      cloudGatewayUrl = document.getElementById('cfgGatewayUrl').value.trim();
      cloudPublishKey = document.getElementById('cfgPublishKey').value.trim();
      localStorage.setItem('lighthouse_gateway_url', cloudGatewayUrl);
      localStorage.setItem('lighthouse_publish_key', cloudPublishKey);

      toggleConfigModal();
      showToast('配置已保存并重新同步！');
      reloadAllData();
    }

    // 轻量 Toast
    let toastTimeout = null;
    function showToast(msg, type = 'success') {
      const toast = document.getElementById('mobileToast');
      const text = document.getElementById('toastMsg');
      const icon = document.getElementById('toastIcon');

      text.innerText = msg;
      if (type === 'error') {
        icon.className = 'fa-solid fa-circle-xmark text-rose-400';
      } else if (type === 'warning') {
        icon.className = 'fa-solid fa-triangle-exclamation text-amber-400';
      } else if (type === 'info') {
        icon.className = 'fa-solid fa-spinner fa-spin text-indigo-400';
      } else {
        icon.className = 'fa-solid fa-circle-check text-emerald-400';
      }

      toast.classList.remove('hidden');
      clearTimeout(toastTimeout);
      toastTimeout = setTimeout(() => {
        toast.classList.add('hidden');
      }, 2300);
    }

    // 初始化运行
    window.onload = function() {
      initSubjectChips();
      setMobileStars(3);
      reloadAllData();
    };
  </script>
