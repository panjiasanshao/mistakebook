services:
  app:
    image: ${AI_CODING_IMAGE}
    platform: linux/amd64
    environment:
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: "1000"
    volumes:
      - ./app:/workspace
      - node_modules:/workspace/node_modules
    ports:
      - "${AI_CODING_PORT:-5187}:5187"
    healthcheck:
      test: ["CMD", "test", "-f", "/workspace/node_modules/.knowstar-image-seeded"]
      interval: 2s
      timeout: 2s
      retries: 30
volumes:
  node_modules:
